<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="preload" href="Inter-Bold.woff2" as="font" crossorigin="anonymous">
    <style>
      @font-face {
        font-family: 'Inter';
        font-style:  normal;
        font-weight: 700;
        font-display: swap;
        src: url("Inter-Bold.woff2") format("woff2");
      }

      body {
        width: 200px;
        font-family: system-ui, sans-serif;
        font-size: 75%;
        margin-bottom: 4px;
      }

      .section {
        padding: 5px 0;
        overflow: hidden;
      }

      .grid {
        display: inline-block;
      }

      .kana-size .literal {
        padding: 0 0 0 5px;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .display-block {
        display: block;
      }

      .round-toggle-button {
        cursor: pointer;
        width: 48px;
        height: 20px;
        border-radius: 10px;
        background: #337ab7;
        transition: background .3s;
        position: relative;
      }
      .round-toggle-button:hover {
        background: #265a88;
      }
      .round-toggle-button::before {
        width: 24px;
        height: 100%;
        margin: 0 5px;
        font-family: Inter;
        font-style: normal;
        font-weight: 700;
        font-size: 10px;
        line-height: 16px;
        letter-spacing: .4px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        content: 'ON';
      }
      .round-toggle-button .button {
        top: 2px;
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 8px;
        background: #fff!important;
        display: inline-block;
        transition: left .2s,background .2s;
        left: 30px;
      }

      .round-toggle-button.disabled {
        background: #9fa6bf;
      }
      .round-toggle-button.disabled:hover {
        background: #6d758d;
      }
      .round-toggle-button.disabled::before {
        float: right;
        content: 'OFF';
      }
      .round-toggle-button.disabled .button {
        left: 2px;
      }

      .app-icon {
        width: 32px;
        height: 32px;
        position: relative;
        border: 1px solid gray;
        overflow: hidden;
        margin-left: 2px;
        cursor: pointer;
      }

      .app-icon div {
        position: absolute;
        color: orange;
        font-size: 17px;
        top: 16px;
      }

      .app-icon ruby {
        font-size: 10px;
        color: black;
        position: absolute;
        top: 7px;
        left: 2px;
      }

      .flex {
        display: flex;
      }

      .flex-0-0-auto {
        flex: 0 0 auto;
      }

      .site-name {
        overflow: scroll;
        align-items: center;
        flex: 1;
        margin: 0 0 0 5px;
      }

      .kana-size input {
        width: 95%;
        margin-top: 5px;
      }

      .error-overlay {
        position: absolute;
        top: 0;
        width: 200px;
        height: 100%;
        background: white;
        text-align: center;
        align-content: center;
      }

    </style>
  </head>
  <body>
    <div class="main">
      <div class="section head flex">
        <div class="grid">
          <div class="round-toggle-button btn-toggle-site">
            <div class="button"></div>
          </div>
        </div>
        <div class="grid flex site-name">
        </div>
      </div>

      <hr />

      <div class="section kana-size">
        <div>
          <span class="literal"></span>
          <span class="value"></span>
          %
        </div>
        <div>
          <input type="range" min="50" max="90" step="5" />
        </div>
      </div>

      <hr />

      <div class="section footer">
        <div class="grid">
          <div class="app-icon">
            <ruby>かんじ</ruby>
            <div>漢字</div>
          </div>
        </div>
        <div class="grid">
          <div>
            <span class="version display-block"></span>
          </div>
          <a class="feedback display-block" href="#"></a>
        </div>
      </div>
    </div>

    <div class="error-overlay">
      <div>Please refresh current page to enabled this extension.</div>
    </div>

    <script src="/constants.js"></script>
    <script src="/components/dom.js"></script>
    <script src="/common-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
